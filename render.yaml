services:
  - type: web
    name: noticiasosint
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app_entry.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GAD_PASSWORD
        sync: false
      - key: MYMEMORY_EMAIL
        sync: false
