name: Informe por correo (8:00 y 20:00)

on:
  schedule:
    # Horas UTC de ambos horarios (invierno/verano); el paso "Comprobar hora" deja pasar solo las 8:00 y 20:00 de Madrid
    - cron: "0 6,7,18,19 * * *"
  workflow_dispatch:

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar hora
        id: hora
        run: |
          h=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$h" = "08" ] || [ "$h" = "20" ]; then
            echo "enviar=si" >> "$GITHUB_OUTPUT"
          else
            echo "enviar=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.enviar == 'si'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.enviar == 'si'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.hora.outputs.enviar == 'si'
        run: pip install -r requirements.txt

      - name: Generar y enviar el informe
        if: steps.hora.outputs.enviar == 'si'
        env:
          GAD_SMTP_HOST: ${{ secrets.GAD_SMTP_HOST }}
          GAD_SMTP_PORT: ${{ secrets.GAD_SMTP_PORT }}
          GAD_SMTP_USER: ${{ secrets.GAD_SMTP_USER }}
          GAD_SMTP_PASS: ${{ secrets.GAD_SMTP_PASS }}
          GAD_MAIL_FROM: ${{ secrets.GAD_MAIL_FROM }}
          GAD_MAIL_TO: ${{ secrets.GAD_MAIL_TO }}
        run: python -m buscador_noticias.informe_diario --enviar --salida informes
