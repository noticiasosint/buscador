name: Mantener app despierta

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Abrir la app como un navegador
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python - <<'EOF'
          import os, time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page()
              page.goto(os.environ["APP_URL"], timeout=120000)
              # Si estaba dormida, pulsa el botón de despertar.
              boton = page.get_by_role("button", name="Yes, get this app back up!")
              if boton.count():
                  boton.click()
              time.sleep(45)
              print(page.title())
              b.close()
          EOF