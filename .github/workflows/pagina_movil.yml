name: Pagina movil cifrada

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina-movil
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar pagina
        run: python -m buscador_noticias.pagina_movil --salida pagina

      - name: Cifrar con contrasena
        env:
          PAGINA_CLAVE: ${{ secrets.PAGINA_CLAVE }}
        run: |
          if [ -z "$PAGINA_CLAVE" ]; then echo "Falta el secreto PAGINA_CLAVE"; exit 1; fi
          npx --yes staticrypt@3 pagina/index.html -p "$PAGINA_CLAVE" --short -d public \
            --template-title "Acceso" --template-instructions "Introduce la clave" > /dev/null
          test -f public/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: despliegue
        uses: actions/deploy-pages@v4
